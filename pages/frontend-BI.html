<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BI 经营分析 · 前端设计规范库</title>
<link rel="stylesheet" href="css/frontend-base.css">
<link rel="stylesheet" href="css/frontend-BI.css">
</head>
<body>
<div class="sy-scope">
  <div class="fa-shell chrome-bi" id="faShell">
    <div class="fa-top">
      <button class="fa-menu-btn" id="faMenuBtn" type="button" aria-label="展开菜单">☰</button>
      <a class="fa-home" href="frontend-style.html" aria-label="返回规范库">←</a>
      <div class="fa-brand"><span class="fa-logo" id="faLogo">B</span><span id="faName">BI 经营分析</span></div>
      <div class="fa-tabs" id="faTabs"></div>
      <div class="fa-crumbs" id="faCrumbs"></div>
      
      <div class="fa-search"><input id="faSearch" type="text" placeholder="搜索当前页…" autocomplete="off" /></div>
      <button class="fa-close" id="faClose" type="button" aria-label="返回规范库">✕</button>
    </div>
    <div class="fa-body">
      <aside class="fa-side" id="faSide"></aside>
      <main class="fa-main" id="faMain">
        <div class="fa-filterbar" id="faFilterBar">
          <select aria-label="时间范围"><option>近 12 周</option><option>近 30 天</option><option>本季度</option></select>
          <select aria-label="渠道"><option>全部渠道</option><option>自营</option><option>渠道</option></select>
          <select aria-label="区域"><option>全部区域</option><option>华东</option><option>华南</option></select>
          <span class="chip">对比上期</span>
        </div>
        <div id="faPage"></div>
      </main>
    </div>
    <div class="fa-modal" id="faModal"><div class="fa-modal-card" id="faModalCard"></div></div>
    <div class="fa-toast-wrap" id="faToast"></div>
  </div>
</div>
<script src="js/frontend-core.js"></script>
<script src="js/frontend-BI.js"></script>
</body>
</html>
