<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#101821"><title>问题排查库 · 工作工具</title><link rel="stylesheet" href="../css/work-hub.css"></head>
<body class="gate-locked">
<div class="gate" id="gate" data-pw-field="work-hub-PW"><div class="gate-card"><p class="eyebrow">PRIVATE WORKSPACE</p><h2>问题排查库</h2><p>输入工作区密码，查找与记录排查方法。</p><label for="gatePw">访问密码</label><input type="password" id="gatePw" autocomplete="off"><button id="gateBtn" type="button">进入排查库</button><p id="gateMsg" role="status"></p></div></div>
<script>window['work-hub-PW']='work2026';</script>
<header class="hub-header hub-wrap"><a href="work.html" class="hub-brand">WORK / 工作台</a><a href="../index.html">返回主页 ↗</a></header>
<main class="hub-wrap"><nav class="hub-nav" aria-label="工作台导航"><a href="work.html">工作经验</a><a href="troubleshooting.html" aria-current="page">问题排查</a><a href="doc-templates.html">文档模板</a><a href="snippets.html">命令片段</a></nav><section class="hub-hero"><p class="eyebrow">DEBUG / RECORD / REUSE</p><h1>把解决过的问题，<br>留给下一次的自己。</h1><p>从现象定位原因，按步骤验证结果。内置排查示例，也能记录你的处理过程。</p><p class="status">个人记录与收藏仅保存在当前浏览器，请定期导出备份。示例中的环境与结论需要结合实际验证。</p></section>
<section class="panel" aria-label="查找与管理"><div class="toolbar"><input id="search" type="search" placeholder="搜索现象、错误、命令，如：端口、CORS" aria-label="搜索问题"><button class="btn" id="add" type="button">＋ 记录问题</button><button class="btn secondary" id="export" type="button">导出备份</button><button class="btn secondary" id="import" type="button">导入备份</button><input id="importFile" type="file" accept="application/json,.json" hidden></div><div class="chips" id="categories" role="group" aria-label="问题分类"></div><label><input id="favoritesOnly" type="checkbox"> 只看收藏</label><p class="status" id="resultStatus" role="status" aria-live="polite"></p><p class="status" id="storageStatus" role="status"></p></section>
<section class="library-grid" id="results" aria-label="排查条目"></section><p class="empty" id="empty" hidden>没有找到相关条目。试试其他关键词，或记录一个新问题。</p>
<dialog id="editor" aria-labelledby="editorTitle"><form id="editForm"><h2 id="editorTitle">记录问题</h2><label class="field">问题标题<input name="title" maxlength="100" required></label><label class="field">分类<input name="category" maxlength="30" required placeholder="如：Git / 网络"></label><label class="field">现象与报错<textarea name="symptom" maxlength="6000" required></textarea></label><label class="field">适用环境<input name="environment" maxlength="300" required placeholder="系统、软件版本、触发条件"></label><label class="field">排查步骤（每行一步）<textarea name="steps" maxlength="10000" required></textarea></label><label class="field">解决办法<textarea name="solution" maxlength="10000" required></textarea></label><label class="field">验证方式<textarea name="verification" maxlength="6000" required></textarea></label><label class="field">参考命令（可选，仅供复制）<textarea name="command" maxlength="10000" spellcheck="false"></textarea></label><div class="card-actions"><button class="btn" type="submit">保存记录</button><button class="btn secondary" id="cancel" type="button">取消</button></div></form></dialog>
</main><footer class="hub-footer hub-wrap">WORK TOOLS · 命令仅供复制，请确认环境与参数后执行。<a href="work.html">查看工作经验 ↗</a></footer>
<script src="../script/studio.js"></script><script src="../js/gate.js"></script><script src="../js/troubleshooting.js"></script></body></html>
